<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Feature Requests</title>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<style>
/* ================= MODERN MINIMAL + HUMAN APPROACHABLE ================= */
:root {
    --bg: oklch(99% 0.002 240);
    --surface: oklch(100% 0 0);
    --fg: oklch(18% 0.012 250);
    --muted: oklch(54% 0.012 250);
    --border: oklch(92% 0.005 250);
    --accent: oklch(72% 0.17 55);
    --accent-soft: oklch(95% 0.05 55);
    --accent-strong: oklch(64% 0.18 55);
    --success: oklch(74% 0.14 150);
    --radius: 16px;
}

* { box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    background: linear-gradient(180deg, #ffffff 0%, #f8f9fc 100%);
    color: var(--fg);
    margin: 0;
    min-height: 100dvh;
    padding: clamp(14px, 3vw, 28px);
}

#home, #add, #detail {
    width: min(100%, 920px);
    margin: 0 auto;
}

.home-topbar {
    position: sticky;
    top: clamp(8px, 2vw, 16px);
    z-index: 20;
    margin-bottom: 12px;
}

.topbar-inner {
    background: color-mix(in oklch, var(--surface) 94%, #f7f8fb 6%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 10px 12px;
    box-shadow: 0 8px 24px rgba(20, 28, 40, 0.06);
}

.panel {
    background: color-mix(in oklch, var(--surface) 92%, #f7f8fb 8%);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: clamp(14px, 2.2vw, 24px);
    box-shadow: 0 12px 36px rgba(20, 28, 40, 0.06);
}

.header {
    display: grid;
    grid-template-columns: 40px 1fr 40px;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
}

.header h2,
.header h3 {
    margin: 0;
    text-align: center;
    font-size: clamp(1.15rem, 1.8vw, 1.45rem);
    letter-spacing: -0.02em;
}

.subtitle {
    color: var(--muted);
    margin: 0 0 16px;
    text-align: center;
    font-size: 0.96rem;
}

.icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
}

.input-row {
    display: grid;
    grid-template-columns: 1fr 138px 138px;
    gap: 10px;
    margin-bottom: 8px;
}

input, textarea, select {
    width: 100%;
    padding: 12px 13px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--fg);
    font-size: 16px;
    outline: none;
}

input:focus, textarea:focus, select:focus {
    border-color: color-mix(in oklch, var(--accent) 54%, var(--border) 46%);
    box-shadow: 0 0 0 4px color-mix(in oklch, var(--accent) 16%, white 84%);
}

textarea {
    resize: vertical;
    min-height: 110px;
}

#add input,
#add textarea {
    margin-bottom: 12px;
}

button {
    width: 100%;
    border-radius: 12px;
    border: 1px solid transparent;
    padding: 12px 14px;
    font-size: 15px;
    font-weight: 600;
    background: var(--accent);
    color: #2f1700;
    cursor: pointer;
}

button:hover { background: var(--accent-strong); }

.feature {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-top: 10px;
    transition: transform 0.16s ease, box-shadow 0.16s ease;
}

.feature:hover {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(18, 26, 40, 0.08);
}

.feature-title {
    font-weight: 630;
    margin-bottom: 7px;
    letter-spacing: -0.015em;
    word-break: break-word;
}

.feature-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 11px;
}

.tag {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    background: color-mix(in oklch, var(--accent-soft) 42%, white 58%);
    color: color-mix(in oklch, var(--accent-strong) 58%, var(--fg) 42%);
    padding: 4px 9px;
    border-radius: 999px;
    margin: 0 5px 5px 0;
    border: 1px solid color-mix(in oklch, var(--accent) 18%, var(--border) 82%);
}

.badge {
    font-size: 11px;
    padding: 5px 10px;
    border-radius: 999px;
    text-transform: capitalize;
    font-weight: 600;
}

.badge.open { background: #f1f4f8; color: #3c4a5a; }
.badge.in_progress { background: #ffe8c6; color: #6f3d00; }
.badge.done { background: #d8f4e5; color: #0d5c37; }
.badge.coming_soon { background: #ffe0ec; color: #8a1742; }

.vote-btn {
    width: auto;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: 600;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--fg);
    opacity: 0.95;
    transition: all 0.2s ease;
}

.vote-btn:hover {
    border-color: color-mix(in oklch, var(--accent) 45%, var(--border) 55%);
    background: color-mix(in oklch, var(--accent-soft) 22%, white 78%);
}

.vote-btn.voted {
    opacity: 0.56;
    transform: scale(0.97);
}

#detailDesc {
    color: var(--muted);
    line-height: 1.55;
}

#similarBox .similar-empty,
#similarBox .similar-title {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
}

#similarBox .similar-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 10px;
    margin-bottom: 6px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    gap: 10px;
}

#similarBox .similar-item-text {
    font-size: 13px;
    color: var(--fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.hidden { display: none; }

.list-state {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px;
    margin-top: 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 14px;
}

.list-state.error {
    justify-content: space-between;
    color: #8a1742;
    border-color: color-mix(in oklch, #8a1742 25%, var(--border) 75%);
    background: #fff7fb;
}

.spinner {
    width: 16px;
    height: 16px;
    border-radius: 999px;
    border: 2px solid color-mix(in oklch, var(--accent) 20%, white 80%);
    border-top-color: var(--accent-strong);
    animation: spin 0.9s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 640px) {
    .input-row {
        grid-template-columns: 1fr;
    }

    .list-state.error {
        align-items: flex-start;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->
<div id="home">
<div class="home-topbar">
<div class="topbar-inner">
<div class="header" style="margin-bottom:0;">
    <div></div>
    <h2 style="text-align:left;">Feedback Board</h2>
    <button class="icon-btn" onclick="showPage('add')" aria-label="Submit feedback">+</button>
</div>
</div>
</div>

<div class="panel">
<p class="subtitle">Share ideas, discover similar requests, and vote for what matters most.</p>

<div class="input-row">
    <input id="search" placeholder="Search..." oninput="applyFilters()" />
    <select id="statusFilter" onchange="applyFilters()">
        <option value="">All</option>
        <option value="open">Open</option>
        <option value="in_progress">In progress</option>
        <option value="done">Done</option>
    </select>
    <select id="typeFilter" onchange="applyFilters()">
        <option value="">All types</option>
        <option value="feature">Feature</option>
        <option value="bug">Bug</option>
        <option value="ui">UI</option>
        <option value="performance">Performance</option>
        <option value="other">Other</option>
    </select>
</div>

<div id="list"></div>
<div id="listState" class="list-state hidden"></div>

</div>
</div>

<!-- ================= ADD ================= -->
<div id="add" class="hidden">
<div class="panel">

<div class="header">
    <button class="icon-btn" onclick="showPage('home')">←</button>
    <h3>Submit Feedback</h3>
    <div></div>
</div>
<p class="subtitle">Describe your idea clearly so others can find and support it.</p>

<input id="title" placeholder="Title" />
<textarea id="descInput" placeholder="Description"></textarea>
<select id="feedbackType">
    <option value="feature">Feature</option>
    <option value="bug">Bug</option>
    <option value="ui">UI</option>
    <option value="performance">Performance</option>
    <option value="other">Other</option>
</select>

<div id="similarBox" style="margin-bottom:12px;"></div>

<button onclick="addFeature()">Submit</button>

</div>
</div>

<!-- ================= DETAIL ================= -->
<div id="detail" class="hidden">
<div class="panel">

<div class="header">
    <button class="icon-btn" onclick="showPage('home')">←</button>
    <h3 id="detailTitle"></h3>
    <div></div>
</div>

<div id="detailTags"></div>
<p id="detailDesc"></p>

<button id="detailVote"></button>

</div>
</div>

<script>
const supabaseClient = window.supabase.createClient(
    "https://ixcylpmyupmoarebbhjy.supabase.co",
    "sb_publishable_c1Wmk7ON_QO4xorRQmkXNg_23q-OcEl"
);

let features = [];

function normalizeFeedbackType(value) {
    const type = String(value || "").trim().toLowerCase();
    if (["feature", "bug", "ui", "performance", "other"].includes(type)) return type;
    return "feature";
}

function getFeedbackType(feature) {
    if (Array.isArray(feature?.tags) && feature.tags.length > 0) {
        return normalizeFeedbackType(feature.tags[0]);
    }
    return "feature";
}

function toTypeLabel(type) {
    if (type === "ui") return "UI";
    return type.charAt(0).toUpperCase() + type.slice(1);
}

function setLoading(isLoading) {
    const list = document.getElementById("list");
    const state = document.getElementById("listState");

    if (isLoading) {
        list.innerHTML = "";
        state.className = "list-state";
        state.innerHTML = `<span class="spinner" aria-hidden="true"></span><span>Loading feedback...</span>`;
    } else {
        state.classList.add("hidden");
        state.innerHTML = "";
    }
}

function setLoadError(message) {
    const state = document.getElementById("listState");
    state.className = "list-state error";
    state.innerHTML = `
        <span>${message}</span>
        <button onclick="load()" style="width:auto;padding:7px 10px;font-size:13px;">Retry</button>
    `;
}

/* NAV */
function showPage(p) {
    ["home","add","detail"].forEach(id =>
        document.getElementById(id).classList.add("hidden")
    );
    document.getElementById(p).classList.remove("hidden");
}

/* TRENDING ALGORITHM */
function getScore(f) {
    const votes = f.votes || 0;
    const age = (Date.now() - new Date(f.created_at || Date.now())) / 10000000;
    return votes * 10 - age;
}

/* LOAD */
async function load() {
    setLoading(true);
    let didFail = false;

    try {
        const { data, error } = await supabaseClient
            .from("features")
            .select("*");

        if (error) throw error;

        features = data || [];
        features.sort((a,b) => getScore(b) - getScore(a));

        render(features);
        updateSimilar();
    } catch (err) {
        didFail = true;
        console.error("Failed to load feedback:", err);
        setLoadError("Could not load feedback right now.");
    } finally {
        if (!didFail) setLoading(false);
    }
}

/* FILTER */
function applyFilters() {
    const search = document.getElementById("search").value.toLowerCase();
    const status = document.getElementById("statusFilter").value;
    const type = document.getElementById("typeFilter").value;

    const filtered = features.filter(f => {
        const feedbackType = getFeedbackType(f);
        return (
            (!search ||
                f.title?.toLowerCase().includes(search) ||
                f.description?.toLowerCase().includes(search)
            ) &&
            (!status || (f.status || "open") === status) &&
            (!type || feedbackType === type)
        );
    });

    render(filtered);
}

/* RENDER */
function render(data) {
    const list = document.getElementById("list");
    list.innerHTML = "";

    data.forEach(f => {
        const div = document.createElement("div");
        div.className = "feature";
        const feedbackType = getFeedbackType(f);

        div.innerHTML = `
            <div class="feature-title">${f.title}</div>

            <div>
                <span class="tag">${toTypeLabel(feedbackType)}</span>
            </div>

            <div class="feature-bottom">
                <span class="badge ${f.status || 'open'}">
                    ${(f.status || 'open').replace("_"," ")}
                </span>

                <button class="vote-btn ${getVoted().includes(f.id) ? 'voted' : ''}">     
                    ^ ${f.votes} 
                </button>
            </div>
        `;

        div.onclick = (e) => {
            if (e.target.tagName === "BUTTON") return;
            openDetail(f);
        };

        const btn = div.querySelector("button");
        btn.onclick = (e) => {
            e.stopPropagation();
            vote(f.id, f.votes);
        };

        list.appendChild(div);
    });
}

/* DETAIL */
function openDetail(f) {
    const feedbackType = getFeedbackType(f);
    document.getElementById("detailTitle").innerText = f.title;
    document.getElementById("detailDesc").innerText = f.description;

    document.getElementById("detailTags").innerHTML =
        `<span class="tag">${toTypeLabel(feedbackType)}</span>`;

    const btn = document.getElementById("detailVote");
    btn.innerText = "^ " + f.votes;
    btn.onclick = () => vote(f.id, f.votes);

    showPage("detail");
}

/* VOTE (GLOBAL LOCK) */
function getVoted() {
    return JSON.parse(localStorage.getItem("voted") || "[]");
}

function saveVoted(v) {
    localStorage.setItem("voted", JSON.stringify(v));
}

async function vote(id, votes) {
    let voted = getVoted();
    if (voted.includes(id)) return;

    voted.push(id);
    saveVoted(voted);

    await supabaseClient
        .from("features")
        .update({ votes: votes + 1 })
        .eq("id", id);

    load();
}

/* ADD */
async function addFeature() {
    const title = document.getElementById("title").value.trim();
    const description = document.getElementById("descInput").value.trim();
    const feedbackType = normalizeFeedbackType(
        document.getElementById("feedbackType").value
    );

    if (title.length < 3) return;

    const match = findClosestMatch(title);

    if (match && match.score > 0.55) {
        const ok = confirm(
            `This looks similar to:\n\n"${match.item.title}"\n\nDo you still want to post it?`
        );

        if (!ok) return;
    }

    await supabaseClient.from("features").insert([{
        title,
        description,
        tags: [feedbackType],
        votes: 0,
        status: "open"
    }]);

    showPage("home");
    load();
}

function levenshtein(a, b) {
    const matrix = Array.from({ length: b.length + 1 }, () =>
        new Array(a.length + 1).fill(0)
    );

    for (let i = 0; i <= b.length; i++) matrix[i][0] = i;
    for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

    for (let i = 1; i <= b.length; i++) {
        for (let j = 1; j <= a.length; j++) {
            if (b[i - 1] === a[j - 1]) {
                matrix[i][j] = matrix[i - 1][j - 1];
            } else {
                matrix[i][j] = Math.min(
                    matrix[i - 1][j] + 1,
                    matrix[i][j - 1] + 1,
                    matrix[i - 1][j - 1] + 1
                );
            }
        }
    }

    return matrix[b.length][a.length];
}

function normalize(text) {
    return text
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, "")
        .split(" ")
        .filter(Boolean);
}

function similarity(a, b) {
    const aWords = normalize(a);
    const bWords = normalize(b);

    const intersection = aWords.filter(w => bWords.includes(w)).length;
    const union = new Set([...aWords, ...bWords]).size;

    return intersection / union;
}

function findClosestMatch(title) {
    let best = null;

    for (const f of features) {
        const score = similarity(title, f.title);

        if (!best || score > best.score) {
            best = { item: f, score };
        }
    }

    return best;
}

function updateSimilar() {
    const title = document.getElementById("title").value.trim();
    const box = document.getElementById("similarBox");

    if (!title || title.length < 2) {
        box.innerHTML = "";
        return;
    }

    const matches = features
        .map(f => ({
            ...f,
            score: similarity(title, f.title)
        }))
        .filter(f => f.score > 0.25)
        .sort((a,b) => b.score - a.score)
        .slice(0, 5);

    if (matches.length === 0) {
        box.innerHTML = `
            <div class="similar-empty">
                No similar results
            </div>
        `;
        return;
    }

    box.innerHTML = `
        <div class="similar-title">
            Similar results
        </div>

        ${matches.map(f => `
            <div class="similar-item">
                <div class="similar-item-text">
                    ${f.title}
                </div>

                <button
                    class="vote-btn ${getVoted().includes(f.id) ? 'voted' : ''}"
                    onclick="vote(${f.id}, ${f.votes})"
                    style="width:auto;padding:4px 8px;font-size:12px;"
                >
                    👍 ${f.votes}
                </button>
            </div>
        `).join("")}
    `;
}

document.getElementById("title").addEventListener("input", updateSimilar);

/* START */
load();
</script>

</body>
</html>
